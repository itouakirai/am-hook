<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>am-hook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23fb2c55'/%3E%3Cpath d='M9.5 16.5V7l7-1.5v9' fill='none' stroke='white' stroke-width='1.8'/%3E%3Ccircle cx='7.5' cy='16.5' r='2' fill='white'/%3E%3Ccircle cx='14.5' cy='14.5' r='2' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="home-page">
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        </span>
        <span class="brand-name">am-hook</span>
      </a>
      <div class="topbar-right">
        <span class="status-pill" id="status" aria-live="polite"><span class="status-dot"></span><span>wrapper-lite</span></span>
        <button class="btn lang-btn" type="button" data-lang-toggle>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/></svg>
          <span class="lang-label"></span>
        </button>
      </div>
    </header>

    <main class="home">
      <section class="home-hero">
        <p class="home-eyebrow"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>APPLE MUSIC · LOSSLESS · SPATIAL AUDIO</p>
        <h1 class="hero-lead" data-i18n="home.intro"></h1>

        <form class="search" id="form" novalidate>
          <label class="search-field">
            <span class="sr-only" data-i18n="home.inputLabel"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1L11 5"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1L13 19"/></svg>
            <input id="input" type="text" inputmode="url" enterkeyhint="go" autocomplete="off" spellcheck="false"
                   placeholder="https://music.apple.com/cn/song/…/1468058171" aria-describedby="detect error">
            <span class="detect" id="detect" aria-live="polite" hidden></span>
            <kbd class="kbd" aria-hidden="true">/</kbd>
          </label>
          <button class="btn btn-primary btn-lg" type="submit">
            <span data-i18n="home.submit"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
          </button>
        </form>
        <div class="alert error" id="error" role="alert" hidden></div>
        <p class="hint" data-i18n="home.formHint"></p>
        <p class="examples">
          <span data-i18n="home.example"></span>
          <button class="example" type="button" data-example="https://music.apple.com/us/song/cruel-summer/1468058171"><b data-i18n="home.detectSong"></b>Cruel Summer</button>
          <button class="example" type="button" data-example="https://music.apple.com/us/music-video/born-again-feat-doja-cat-raye/1794822079"><b data-i18n="home.detectMv"></b>Born Again</button>
        </p>      </section>

      <section class="recent" id="recent" hidden>
        <div class="section-head">
          <h2 class="section-title" data-i18n="home.recent"></h2>
          <button class="link-btn" id="clear-recent" type="button" data-i18n="home.clear"></button>
        </div>
        <div class="recent-list" id="recent-list"></div>
      </section>

      <ul class="formats">
        <li class="format" style="--tint: #fb2c55"><span class="format-tag" data-i18n="q.lossless"></span><strong>ALAC</strong><span data-i18n="home.fmtAlac"></span></li>
        <li class="format" style="--tint: #8b6cf6"><span class="format-tag" data-i18n="home.tagAtmos"></span><strong>Dolby Atmos</strong><span data-i18n="home.fmtAtmos"></span></li>
        <li class="format" style="--tint: #e8931c"><span class="format-tag" data-i18n="home.tagAac"></span><strong>AAC</strong><span data-i18n="home.fmtAac"></span></li>
        <li class="format" style="--tint: #19a7a0"><span class="format-tag" data-i18n="home.tagMv"></span><strong>Music Video</strong><span data-i18n="home.fmtMv"></span></li>
      </ul>
    </main>

    <footer class="footer">
      <span data-i18n="footer.tagline"></span>
      <span data-i18n="footer.note"></span>
    </footer>
  </div>

  <script src="/assets/i18n.js"></script>
  <script>
    const { t } = window.AmI18n;
    AmI18n.apply();
    const input = document.getElementById('input');
    const errorEl = document.getElementById('error');
    const detectEl = document.getElementById('detect');
    /** wrapper-lite 状态：null 表示检查中，否则为 { ok, regions } */
    let wrapperStatus = null;

    /** 把各种输入规整为页面路径：/https://music.apple.com/{cc}/(song|music-video)/{slug}/{id} */
    function toSongLink(raw) {
      const value = raw.trim();
      if (/^\d{5,}$/.test(value)) return `https://music.apple.com/us/song/_/${value}`;
      let url;
      try { url = new URL(value); } catch { return null; }
      if (!/(^|\.)music\.apple\.com$/i.test(url.hostname)) return null;
      const parts = url.pathname.split('/').filter(Boolean);
      const cc = /^[a-z]{2}$/i.test(parts[0] || '') ? parts[0].toLowerCase() : 'us';
      const mv = url.pathname.match(/^\/[a-z]{2}\/music-video\/(?:([^/]+)\/)?(\d+)\/?$/i);
      if (mv) return `https://music.apple.com/${cc}/music-video/${mv[1] || '_'}/${mv[2]}`;
      const song = url.pathname.match(/\/song\/([^/]+)\/(\d+)/i);
      if (song) return `https://music.apple.com/${cc}/song/${song[1]}/${song[2]}`;
      const trackId = url.searchParams.get('i');
      const album = url.pathname.match(/\/album\/([^/]+)\//i);
      if (trackId && /^\d+$/.test(trackId)) return `https://music.apple.com/${cc}/song/${album ? album[1] : '_'}/${trackId}`;
      return null;
    }

    document.getElementById('form').addEventListener('submit', (event) => {
      event.preventDefault();
      const link = toSongLink(input.value);
      input.setAttribute('aria-invalid', String(!link));
      errorEl.hidden = !!link;
      if (!link) {
        errorEl.textContent = t('home.invalid');
        input.focus();
        return;
      }
      location.href = '/' + link;
    });
    input.addEventListener('input', () => { input.removeAttribute('aria-invalid'); errorEl.hidden = true; renderDetect(); });

    /** 输入时即时提示识别结果：歌曲 / MV 与地区，或纯歌曲 ID */
    function renderDetect() {
      const value = input.value.trim();
      const link = value && toSongLink(value);
      detectEl.hidden = !link;
      if (!link) return;
      if (/^\d{5,}$/.test(value)) { detectEl.textContent = t('home.detectId'); return; }
      const [, cc, kind] = link.match(/^https:\/\/music\.apple\.com\/([a-z]{2})\/(song|music-video)\//);
      detectEl.textContent = `${t(kind === 'song' ? 'home.detectSong' : 'home.detectMv')} · ${cc.toUpperCase()}`;
    }

    // 示例链接：填入输入框，按“解析”即可打开
    document.querySelectorAll('[data-example]').forEach((btn) => btn.addEventListener('click', () => {
      input.value = btn.dataset.example;
      input.dispatchEvent(new Event('input'));
      input.focus();
    }));

    // 按 / 聚焦输入框
    document.addEventListener('keydown', (event) => {
      if (event.key !== '/' || event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable]')) return;
      event.preventDefault();
      input.focus();
    });

    function renderStatus() {
      const pill = document.getElementById('status');
      pill.classList.toggle('ok', !!wrapperStatus && wrapperStatus.ok);
      pill.classList.toggle('bad', !!wrapperStatus && !wrapperStatus.ok);
      pill.lastElementChild.textContent = !wrapperStatus ? t('status.checking')
        : !wrapperStatus.ok ? t('status.down')
        : wrapperStatus.regions.length ? `wrapper-lite · ${wrapperStatus.regions.join(' / ').toUpperCase()}` : t('status.online');
    }

    async function loadStatus() {
      renderStatus();
      try {
        const res = await fetch('/status');
        const data = await res.json();
        if (!res.ok || data.code !== 0) throw new Error();
        wrapperStatus = { ok: true, regions: (data.regions || []).map(String) };
      } catch {
        wrapperStatus = { ok: false, regions: [] };
      }
      renderStatus();
    }

    AmI18n.onChange(() => {
      renderStatus();
      renderDetect();
      if (!errorEl.hidden) errorEl.textContent = t('home.invalid');
    });

    function readRecent() {
      try {
        const items = JSON.parse(localStorage.getItem('am-hook:recent') || '[]');
        return Array.isArray(items) ? items.filter((item) => item && typeof item.link === 'string' && toSongLink(item.link)).slice(0, 12) : [];
      } catch { return []; }
    }

    function renderRecent() {
      const items = readRecent();
      const section = document.getElementById('recent');
      section.hidden = items.length === 0;
      document.getElementById('recent-list').replaceChildren(...items.map((item) => {
        const a = document.createElement('a');
        a.className = 'recent-item';
        a.href = '/' + toSongLink(item.link);
        const cover = Object.assign(document.createElement('span'), { className: 'recent-cover' });
        cover.append(item.artwork ? Object.assign(document.createElement('img'), { src: item.artwork.replace('600x600bb', '300x300bb'), alt: '', loading: 'lazy' })
                                  : Object.assign(document.createElement('span'), { className: 'ph' }));
        a.append(
          cover,
          Object.assign(document.createElement('span'), { className: 'recent-title', textContent: item.title || item.id }),
          Object.assign(document.createElement('span'), { className: 'recent-sub', textContent: item.artist || '' })
        );
        return a;
      }));
    }

    document.getElementById('clear-recent').addEventListener('click', () => {
      try { localStorage.removeItem('am-hook:recent'); } catch {}
      renderRecent();
    });

    loadStatus();
    renderRecent();
  </script>
</body>
</html>
