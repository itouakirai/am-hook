<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>am-hook</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #08080a;
      --surface: #141417;
      --line: #303038;
      --text: #f5f3f1;
      --muted: #a7a2a0;
      --accent: #fb2c55;
      --accent-hover: #ff4466;
      --error: #ff8087;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at 88% 0%, rgba(251, 44, 85, .18), transparent 34rem),
        var(--background);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
    }
    .page {
      width: min(920px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 28px 24px 48px;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #fb2c55, #ff7553);
      color: white;
    }
    .brand-name { font-size: 18px; font-weight: 750; white-space: nowrap; }
    .regions {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      flex-wrap: wrap;
    }
    .region-label { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .region-chip {
      height: 28px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: #e3e0df;
      font-size: 12px;
      font-weight: 650;
    }
    .region-chip.error {
      color: var(--error);
      border-color: rgba(255, 128, 135, .38);
      background: rgba(251, 44, 85, .08);
    }
    .region-chip.loading { position: relative; overflow: hidden; color: transparent; }
    .region-chip.loading::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
      animation: shimmer 1.4s infinite;
    }
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 84px 0;
    }
    .hero-eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 13px; font-weight: 700; }
    h1 {
      max-width: 620px;
      margin: 0 0 14px;
      font-size: clamp(32px, 5vw, 44px);
      line-height: 1.1;
      font-weight: 800;
    }
    .hero-text { max-width: 560px; margin: 0; color: var(--muted); font-size: 15px; }
    .input-panel { margin-top: 34px; width: min(720px, 100%); }
    form { display: flex; gap: 10px; align-items: stretch; }
    .input-wrap { position: relative; min-width: 0; flex: 1; }
    .input-wrap svg {
      position: absolute;
      top: 50%;
      left: 15px;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: #726d6c;
      pointer-events: none;
    }
    input {
      width: 100%;
      height: 52px;
      padding: 0 16px 0 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
    }
    input::placeholder { color: #75706f; }
    input:hover { border-color: #4a4a53; }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(251, 44, 85, .16);
    }
    input.invalid { border-color: var(--error); }
    .submit {
      height: 52px;
      flex: 0 0 auto;
      padding: 0 22px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .submit:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .submit:active { transform: translateY(0); }
    .submit svg { width: 16px; height: 16px; }
    .error {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 128, 135, .38);
      border-radius: 8px;
      background: rgba(251, 44, 85, .09);
      color: var(--error);
    }
    footer { display: flex; justify-content: space-between; gap: 16px; color: #78726f; font-size: 12px; }
    @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    @media (max-width: 620px) {
      .page { padding: 20px 16px 32px; }
      header { align-items: flex-start; }
      .regions { justify-content: flex-start; }
      .hero { padding: 48px 0; }
      form { flex-direction: column; }
      .submit { justify-content: center; width: 100%; }
      footer { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        </div>
        <div class="brand-name">am-hook</div>
      </div>
      <div class="regions" id="regions" aria-live="polite">
        <span class="region-chip loading">Loading</span>
      </div>
    </header>

    <main class="hero">
      <p class="hero-eyebrow">APPLE MUSIC SONG</p>
      <h1>粘贴 song 链接，进入音质解析</h1>
      <p class="hero-text">输入 music.apple.com 上的 song 页面链接，快速查看可用的 media m3u8 和 media file 地址。</p>
      <div class="input-panel">
        <form id="song-form" novalidate>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1L11 5"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1L13 19"/></svg>
            <input id="song-url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://music.apple.com/us/song/…">
          </div>
          <button class="submit" type="submit">
            跳转
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
          </button>
        </form>
        <div class="error" id="error"></div>
      </div>
    </main>

    <footer>
      <span>am-hook local proxy</span>
      <span>song links only</span>
    </footer>
  </div>

  <script>
    const regionsElement = document.getElementById('regions');
    const input = document.getElementById('song-url');
    const errorElement = document.getElementById('error');
    const songPattern = /^https:\/\/music\.apple\.com\/[a-z]{2}\/song\/[^/?#]+\/(\d+)(?:[/?#]|$)/i;

    async function loadRegions() {
      try {
        const response = await fetch('/status');
        const data = await response.json();
        if (!response.ok || data.code !== 0) throw new Error(data.msg || 'wrapper-lite unavailable');
        const regions = Array.isArray(data.regions) ? data.regions.map(String) : [];
        regionsElement.replaceChildren(...[
          Object.assign(document.createElement('span'), { className: 'region-label', textContent: 'regions' }),
          ...(regions.length ? regions : ['无']).map((region) => {
            const chip = document.createElement('span');
            chip.className = 'region-chip';
            chip.textContent = region;
            return chip;
          })
        ]);
      } catch {
        regionsElement.replaceChildren(...[
          Object.assign(document.createElement('span'), { className: 'region-label', textContent: 'status' }),
          Object.assign(document.createElement('span'), { className: 'region-chip error', textContent: 'wrapper-lite 不可用' })
        ]);
      }
    }

    document.getElementById('song-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const value = input.value.trim();
      const valid = songPattern.test(value);
      input.classList.toggle('invalid', !valid);
      errorElement.style.display = valid ? 'none' : 'block';
      errorElement.textContent = valid ? '' : '请输入 https://music.apple.com/{region}/song/{name}/{id} 格式的链接。';
      if (valid) location.href = `/${value}`;
    });

    input.addEventListener('input', () => {
      input.classList.remove('invalid');
      errorElement.style.display = 'none';
    });

    loadRegions();
  </script>
</body>
</html>
