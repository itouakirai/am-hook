<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>am-hook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23fb2c55'/%3E%3Cpath d='M9.5 16.5V7l7-1.5v9' fill='none' stroke='white' stroke-width='1.8'/%3E%3Ccircle cx='7.5' cy='16.5' r='2' fill='white'/%3E%3Ccircle cx='14.5' cy='14.5' r='2' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        </span>
        <span class="brand-name">am-hook</span>
      </a>
      <div class="topbar-right">
        <span class="status-pill" id="status" aria-live="polite"><span class="status-dot"></span><span>检查 wrapper-lite…</span></span>
      </div>
    </header>

    <main class="hero">
      <p class="eyebrow">APPLE MUSIC</p>
      <h1>粘贴歌曲链接，解析音质并在线试听</h1>
      <p class="hero-text">支持 music.apple.com 的 song 链接、带 <code>?i=</code> 的专辑分享链接，或直接输入歌曲 ID。解析后可复制 media m3u8 / media file 地址，或直接在浏览器里播放。</p>

      <form class="search" id="form" novalidate>
        <label class="search-field">
          <span class="sr-only">歌曲链接或 ID</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1L11 5"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1L13 19"/></svg>
          <input id="input" type="text" inputmode="url" autocomplete="off" spellcheck="false" autofocus
                 placeholder="https://music.apple.com/cn/song/…/1468058171" aria-describedby="error">
        </label>
        <button class="btn btn-primary btn-lg" type="submit">
          解析
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
        </button>
      </form>
      <div class="alert error" id="error" hidden></div>
      <p class="hint">示例：<code>https://music.apple.com/cn/album/lover/1468058165?i=1468058171</code></p>

      <section class="recent" id="recent" hidden>
        <div class="section-head">
          <h2 class="section-title">最近解析</h2>
          <button class="link-btn" id="clear-recent" type="button">清空</button>
        </div>
        <div class="recent-list" id="recent-list"></div>
      </section>
    </main>

    <footer class="footer">
      <span>am-hook · 本地解密反代</span>
      <span>仅供个人学习使用</span>
    </footer>
  </div>

  <script>
    const input = document.getElementById('input');
    const errorEl = document.getElementById('error');

    /** 把各种输入规整为 song 页面路径：/https://music.apple.com/{cc}/song/{slug}/{id} */
    function toSongLink(raw) {
      const value = raw.trim();
      if (/^\d{5,}$/.test(value)) return `https://music.apple.com/us/song/_/${value}`;
      let url;
      try { url = new URL(value); } catch { return null; }
      if (!/(^|\.)music\.apple\.com$/i.test(url.hostname)) return null;
      const parts = url.pathname.split('/').filter(Boolean);
      const cc = /^[a-z]{2}$/i.test(parts[0] || '') ? parts[0].toLowerCase() : 'us';
      const song = url.pathname.match(/\/song\/([^/]+)\/(\d+)/i);
      if (song) return `https://music.apple.com/${cc}/song/${song[1]}/${song[2]}`;
      const trackId = url.searchParams.get('i');
      const album = url.pathname.match(/\/album\/([^/]+)\//i);
      if (trackId && /^\d+$/.test(trackId)) return `https://music.apple.com/${cc}/song/${album ? album[1] : '_'}/${trackId}`;
      return null;
    }

    document.getElementById('form').addEventListener('submit', (event) => {
      event.preventDefault();
      const link = toSongLink(input.value);
      input.setAttribute('aria-invalid', String(!link));
      errorEl.hidden = !!link;
      if (!link) {
        errorEl.textContent = '无法识别：请输入 song 链接、带 ?i= 的专辑链接或纯数字歌曲 ID。';
        input.focus();
        return;
      }
      location.href = '/' + link;
    });
    input.addEventListener('input', () => { input.removeAttribute('aria-invalid'); errorEl.hidden = true; });

    async function loadStatus() {
      const pill = document.getElementById('status');
      const label = pill.lastElementChild;
      try {
        const res = await fetch('/status');
        const data = await res.json();
        if (!res.ok || data.code !== 0) throw new Error();
        const regions = (data.regions || []).map(String);
        pill.classList.add('ok');
        label.textContent = regions.length ? `wrapper-lite · ${regions.join(' / ').toUpperCase()}` : 'wrapper-lite 在线';
      } catch {
        pill.classList.add('bad');
        label.textContent = 'wrapper-lite 不可用';
      }
    }

    function readRecent() {
      try { return JSON.parse(localStorage.getItem('am-hook:recent') || '[]'); } catch { return []; }
    }

    function renderRecent() {
      const items = readRecent();
      const section = document.getElementById('recent');
      section.hidden = items.length === 0;
      document.getElementById('recent-list').replaceChildren(...items.map((item) => {
        const a = document.createElement('a');
        a.className = 'recent-item';
        a.href = '/' + item.link;
        const art = item.artwork ? Object.assign(document.createElement('img'), { src: item.artwork.replace('600x600bb', '100x100bb'), alt: '', loading: 'lazy' })
                                 : Object.assign(document.createElement('span'), { className: 'ph' });
        const text = document.createElement('span');
        text.className = 'recent-text';
        text.append(
          Object.assign(document.createElement('span'), { className: 'recent-title', textContent: item.title || item.id }),
          Object.assign(document.createElement('span'), { className: 'recent-sub', textContent: item.artist || '' })
        );
        a.append(art, text);
        return a;
      }));
    }

    document.getElementById('clear-recent').addEventListener('click', () => {
      try { localStorage.removeItem('am-hook:recent'); } catch {}
      renderRecent();
    });

    loadStatus();
    renderRecent();
  </script>
</body>
</html>
