<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>am-hook · MV</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/mv/style.css">
</head>
<body>
  <div class="page mv-page">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-name">am-hook <small>MV</small></span></a>
      <div class="topbar-right"><a href="/" data-i18n="nav.home"></a><button class="btn lang-btn" type="button" data-lang-toggle><span class="lang-label"></span></button></div>
    </header>
    <main>
      <section class="mv-heading"><img id="artwork" alt="" hidden><div><p class="eyebrow">APPLE MUSIC VIDEO</p><h1 id="title">MV</h1><p id="artist"></p></div></section>
      <div class="mv-screen"><video id="video" controls playsinline preload="none"></video></div>
      <div class="mv-actions">
        <button id="play" class="btn btn-primary" disabled data-i18n="mv.play"></button>
        <button id="download" class="btn" disabled data-i18n="mv.download"></button>
        <button id="cancel" class="btn" hidden data-i18n="mv.cancel"></button>
        <a id="save" class="btn" hidden data-i18n="mv.save"></a>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <progress id="progress" max="1" value="0" hidden></progress>
      <div id="error" class="alert error" role="alert" hidden></div>
      <p class="hint" data-i18n="mv.hint"></p>
      <div class="mv-tracks">
        <fieldset id="video-tracks"><legend data-i18n="mv.video"></legend><div id="videos"></div></fieldset>
        <fieldset id="audio-tracks"><legend data-i18n="mv.audio"></legend><div id="audios"></div></fieldset>
      </div>
    </main>
    <footer class="footer"><span data-i18n="footer.tagline"></span><span data-i18n="footer.note"></span></footer>
  </div>
  <script src="/assets/i18n.js"></script>
  <script type="module" src="/assets/mv/page.mjs"></script>
</body>
</html>
