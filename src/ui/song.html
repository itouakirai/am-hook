<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>am-hook · 音质解析</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23fb2c55'/%3E%3Cpath d='M9.5 16.5V7l7-1.5v9' fill='none' stroke='white' stroke-width='1.8'/%3E%3Ccircle cx='7.5' cy='16.5' r='2' fill='white'/%3E%3Ccircle cx='14.5' cy='14.5' r='2' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        </span>
        <span class="brand-name">am-hook</span>
      </a>
      <div class="topbar-right">
        <span class="status-pill" id="status"><span class="status-dot"></span><span>wrapper-lite</span></span>
        <a class="btn" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          主页
        </a>
      </div>
    </header>

    <main>
      <section class="song">
        <div class="cover" id="cover"></div>
        <div class="song-info">
          <p class="eyebrow">SONG</p>
          <h1 class="song-title skeleton" id="title">&nbsp;</h1>
          <p class="song-sub skeleton" id="subtitle">&nbsp;</p>
          <div class="song-meta" id="meta"></div>
          <div class="song-actions">
            <button class="btn btn-primary" id="play-best" type="button" disabled>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z"/></svg>
              播放
            </button>
            <button class="btn" id="vlc-best" type="button" disabled hidden title="用 VLC 播放最高音质">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9.5 3h5l4.5 15H5z"/><path d="M7.6 10h8.8M6.4 14h11.2"/><path d="M3 21h18"/></svg>
              VLC 播放
            </button>
            <button class="btn" id="reparse" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
              重新解析
            </button>
            <a class="btn" id="apple-link" target="_blank" rel="noreferrer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
              Apple Music
            </a>
          </div>
          <p class="song-source" id="source"></p>
        </div>
      </section>

      <div class="alert info" id="alert" hidden aria-live="polite"></div>

      <section class="variants" id="variants" hidden>
        <div class="variants-head">
          <h2 class="variants-title">可用音质</h2>
          <span class="variants-count" id="count"></span>
        </div>
        <div id="variant-list"></div>
      </section>
    </main>
  </div>

  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <div class="player" id="player" hidden>
    <div class="player-track">
      <img class="player-art" alt="">
      <div class="player-text">
        <span class="player-title"></span>
        <span class="player-sub"></span>
      </div>
    </div>
    <div class="player-center">
      <button class="player-skip skip-back" type="button" aria-label="后退 10 秒">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="player-toggle" type="button" aria-label="播放"></button>
      <button class="player-skip skip-fwd" type="button" aria-label="前进 10 秒">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <span class="time time-cur">0:00</span>
      <div class="seek" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="seek-track"><div class="seek-buffer"></div><div class="seek-fill"></div></div>
        <div class="seek-thumb"></div>
      </div>
      <span class="time time-total">0:00</span>
    </div>
    <div class="player-right">
      <span class="badge player-mode" title="播放方式"></span>
      <input class="volume" type="range" min="0" max="1" step="0.01" aria-label="音量">
    </div>
    <p class="player-msg" hidden></p>
  </div>

  <script src="/assets/decrypt.js"></script>
  <script src="/assets/player.js"></script>
  <script>
    const { AmPlayer, detectMode } = window.AmHook;
    const { AmDecrypt } = window;
    const songUrl = decodeURIComponent(location.pathname.slice(1));
    const linkMatch = songUrl.match(/music\.apple\.com\/([a-z]{2})\/song\/[^/?#]+\/(\d+)/i) || [];
    const country = (linkMatch[1] || 'us').toLowerCase();
    const adamId = linkMatch[2];
    const $ = (id) => document.getElementById(id);
    const player = new AmPlayer($('player'));
    const probe = document.createElement('audio');
    let meta = {};
    let variants = [];
    let rows = new Map();
    /** 服务端是否以 --hook 启动（提供服务端解密地址，可用 VLC / IDM） */
    let hook = false;
    /** group_id -> { ctl, done, total }，进行中的浏览器端下载 */
    const downloads = new Map();

    $('source').textContent = songUrl;
    $('apple-link').href = songUrl;

    const ICON = {
      play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z"/></svg>',
      pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
      copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
      list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
      file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
      vlc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9.5 3h5l4.5 15H5z"/><path d="M7.6 10h8.8M6.4 14h11.2"/><path d="M3 21h18"/></svg>',
      more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>',
      server: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    };

    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children.filter((c) => c !== null && c !== undefined && c !== false));
      return node;
    }

    function showAlert(kind, message) {
      const a = $('alert');
      a.className = `alert ${kind}`;
      a.textContent = message;
      a.hidden = !message;
    }

    function formatRate(bps) {
      if (!bps) return '';
      return bps >= 1e6 ? `${(bps / 1e6).toFixed(2)} Mbps` : `${Math.round(bps / 1000)} kbps`;
    }

    /** 由 GROUP-ID / CODECS 推导展示信息 */
    function describe(v) {
      const g = v.group_id.toLowerCase();
      const tags = [];
      if (g.includes('binaural')) tags.push('双耳');
      if (g.includes('downmix')) tags.push('缩混');
      const variantRank = tags.length ? 1 : 0;
      if (g.includes('alac')) {
        const spec = [v.bit_depth && `${v.bit_depth}-bit`, v.sample_rate && `${(v.sample_rate / 1000).toFixed(1).replace(/\.0$/, '')} kHz`].filter(Boolean).join(' / ');
        return { group: '无损', rank: 0, kbps: 0, name: `ALAC${spec ? ' · ' + spec : ''}`, badge: ['Lossless', 'accent'], tags, sub: variantRank };
      }
      if (g.includes('atmos')) {
        // GROUP-ID 形如 atmos-2768：首位是版本号，后三位才是码率（768 kbps）
        const raw = Number((g.match(/atmos-(\d+)/) || [])[1]) || 0;
        const kbps = raw >= 1000 ? raw % 1000 : raw;
        return { group: '杜比全景声', rank: 1, kbps, name: `Dolby Atmos${kbps ? ' · ' + kbps + ' kbps' : ''}`, badge: ['Atmos', 'accent'], tags, sub: variantRank };
      }
      if (g.includes('he-')) {
        const kbps = Number((g.match(/stereo-(\d+)/) || [])[1]) || 0;
        return { group: 'HE-AAC', rank: 3, kbps, name: `HE-AAC${kbps ? ' · ' + kbps + ' kbps' : ''}`, tags, sub: variantRank };
      }
      const kbps = Number((g.match(/stereo-(\d+)/) || [])[1]) || 0;
      return { group: 'AAC', rank: 2, kbps, name: kbps ? `AAC · ${kbps} kbps` : v.group_id, tags, sub: variantRank };
    }

    function hookUrl(absolute) {
      return `${location.origin}/${absolute}`;
    }

    function safeName(s) {
      return s.replace(/[\\/:*?"<>|]+/g, '_').trim();
    }

    let toastTimer;
    function toast(message) {
      const t = $('toast');
      t.textContent = message;
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
    }

    function copy(text, what) {
      const done = () => toast(`已复制${what}`);
      const fallback = () => {
        const area = el('textarea', { value: text });
        area.style.cssText = 'position:fixed;opacity:0';
        document.body.append(area);
        area.select();
        document.execCommand('copy');
        area.remove();
        done();
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    }

    /** VLC 协议链接（与 alist 相同的 vlc://<地址> 格式），打开服务端解密的 media m3u8，所有音质都能播 */
    function vlcHref(v) {
      return `vlc://${v.hookM3u8Url}`;
    }

    function formatSize(bytes) {
      return bytes >= 1024 ** 3 ? `${(bytes / 1024 ** 3).toFixed(2)} GB` : `${(bytes / 1024 ** 2).toFixed(1)} MB`;
    }

    /* ---------- 浏览器端下载：直连 CDN + wasm 解密 + OPFS 暂存 ---------- */
    async function startDownload(v, fileName) {
      const id = v.group_id;
      if (downloads.has(id)) { toast('该音质正在下载'); return; }
      const job = { ctl: new AbortController(), done: 0, total: 0 };
      downloads.set(id, job);
      renderDownload(id);
      try {
        const track = await AmDecrypt.openTrack(v.m3u8Url, job.ctl.signal);
        job.total = track.size;
        renderDownload(id);
        const result = await AmDecrypt.download(track, fileName, {
          signal: job.ctl.signal,
          onProgress: (done) => { job.done = done; renderDownload(id); },
        });
        toast(`解密完成，已交给浏览器保存（${formatSize(result.size)}）`);
      } catch (err) {
        if (err && err.name === 'AbortError') toast('已取消下载');
        else showAlert('error', `下载失败：${(err && err.message) || err}`);
      } finally {
        downloads.delete(id);
        renderDownload(id);
      }
    }

    function renderDownload(id) {
      const r = rows.get(id);
      if (!r) return;
      const job = downloads.get(id);
      r.progress.hidden = !job;
      if (!job) return;
      const ratio = job.total ? job.done / job.total : 0;
      r.progressFill.style.width = `${ratio * 100}%`;
      r.progressText.textContent = job.total
        ? `浏览器解密下载中 ${Math.floor(ratio * 100)}% · ${formatSize(job.done)} / ${formatSize(job.total)}`
        : '正在准备下载…';
    }

    function openInVlc(v) {
      location.href = vlcHref(v);
      toast('正在唤起 VLC…若没有反应，请确认已安装 VLC 并支持 vlc:// 协议');
    }

    /* ---------- 下拉菜单（单例，fixed 定位，避免被列表 overflow 裁剪） ---------- */
    const menu = { el: $('menu'), trigger: null };

    function closeMenu(focusTrigger) {
      if (!menu.trigger) return;
      menu.el.hidden = true;
      menu.trigger.setAttribute('aria-expanded', 'false');
      if (focusTrigger) menu.trigger.focus();
      menu.trigger = null;
    }

    function openMenu(trigger, items) {
      const reopen = menu.trigger === trigger;
      closeMenu(false);
      if (reopen) return;
      menu.el.replaceChildren(...items.map((it) => {
        if (it === '-') return el('div', { className: 'menu-sep', role: 'separator' });
        const node = el(it.href ? 'a' : 'button', { className: 'menu-item', innerHTML: it.icon, tabIndex: -1 });
        if (it.href) { node.href = it.href; if (it.download) node.download = it.download; } else node.type = 'button';
        node.setAttribute('role', 'menuitem');
        node.append(el('span', { className: 'menu-text' },
          el('span', { className: 'menu-label', textContent: it.label }),
          it.hint && el('span', { className: 'menu-hint', textContent: it.hint })));
        node.addEventListener('click', () => { closeMenu(false); if (it.onSelect) it.onSelect(); });
        return node;
      }));
      menu.el.hidden = false;
      menu.trigger = trigger;
      trigger.setAttribute('aria-expanded', 'true');

      // 右对齐触发按钮；下方空间不足（含底部播放条）时向上展开
      const r = trigger.getBoundingClientRect();
      const m = menu.el.getBoundingClientRect();
      const playerTop = $('player').hidden ? innerHeight : $('player').getBoundingClientRect().top;
      const below = playerTop - r.bottom - 8;
      const top = below >= m.height || r.top < m.height + 8 ? r.bottom + 6 : r.top - m.height - 6;
      menu.el.style.top = `${Math.max(8, top)}px`;
      menu.el.style.left = `${Math.min(Math.max(8, r.right - m.width), innerWidth - m.width - 8)}px`;
      menu.el.querySelector('.menu-item').focus();
    }

    menu.el.addEventListener('keydown', (e) => {
      const items = [...menu.el.querySelectorAll('.menu-item')];
      const i = items.indexOf(document.activeElement);
      const go = (n) => { e.preventDefault(); items[(n + items.length) % items.length].focus(); };
      if (e.key === 'ArrowDown') go(i + 1);
      else if (e.key === 'ArrowUp') go(i - 1);
      else if (e.key === 'Home') go(0);
      else if (e.key === 'End') go(items.length - 1);
      else if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
      else if (e.key === 'Tab') closeMenu(false);
    });
    document.addEventListener('pointerdown', (e) => {
      if (menu.trigger && !menu.el.contains(e.target) && !menu.trigger.contains(e.target)) closeMenu(false);
    });
    addEventListener('resize', () => closeMenu(false));
    addEventListener('scroll', () => closeMenu(false), true);

    function variantMenu(v, fileName) {
      const items = [
        { icon: ICON.download, label: '下载解密文件', hint: `浏览器内解密 · ${fileName}`, onSelect: () => startDownload(v, fileName) },
      ];
      if (hook) {
        items.push(
          { icon: ICON.server, label: '通过服务器下载', hint: '由服务端解密，消耗服务器流量', href: v.hookFileUrl, download: fileName },
          '-',
          { icon: ICON.vlc, label: '用 VLC 播放', hint: '所有音质均可播放', href: vlcHref(v),
            onSelect: () => toast('正在唤起 VLC…若没有反应，请确认已安装 VLC 并支持 vlc:// 协议') },
          { icon: ICON.list, label: '复制 media m3u8 地址', hint: '可在 VLC「打开网络串流」中使用', onSelect: () => copy(v.hookM3u8Url, ' media m3u8 地址') },
          { icon: ICON.file, label: '复制 media file 地址', hint: '用于 IDM 等下载工具', onSelect: () => copy(v.hookFileUrl, ' media file 地址') },
        );
      }
      return items;
    }

    function playItem(v) {
      return {
        id: v.group_id,
        codecs: v.codecs,
        m3u8Url: v.m3u8Url,
        hookM3u8Url: v.hookM3u8Url,
        hookFileUrl: v.hookFileUrl,
        label: v.info.name,
        title: meta.title,
        artist: meta.artist,
        album: meta.album,
        artwork: meta.artwork,
      };
    }

    function renderVariants() {
      const list = $('variant-list');
      rows = new Map();
      const nodes = [];
      let lastGroup = null;
      for (const v of variants) {
        if (v.info.group !== lastGroup) {
          lastGroup = v.info.group;
          nodes.push(el('div', { className: 'variant-group', textContent: lastGroup }));
        }
        const playable = !!v.mode;
        const playBtn = el('button', { className: 'play-btn', type: 'button', innerHTML: ICON.play, disabled: !playable });
        playBtn.setAttribute('aria-label', playable ? `播放 ${v.info.name}` : '当前浏览器不支持该编码');
        playBtn.title = playable ? '在线播放' : `当前浏览器不支持 ${v.codecs}，${hook ? '可用 VLC 播放' : '可下载后用本地播放器播放'}`;
        playBtn.addEventListener('click', () => player.play(playItem(v)));

        const name = el('div', { className: 'variant-name' }, v.info.name,
          v.info.badge && el('span', { className: `badge ${v.info.badge[1]}`, textContent: v.info.badge[0] }),
          ...v.info.tags.map((t) => el('span', { className: 'badge', textContent: t })),
          el('span', { className: `badge ${playable ? 'ok' : 'warn'}`, textContent: playable ? '浏览器可播' : (hook ? '需外部播放器' : '仅可下载') }));
        const detail = el('div', { className: 'variant-detail' },
          [v.codecs, formatRate(v.bandwidth), v.channels && `声道 ${v.channels}`].filter(Boolean).join(' · ') + ' · ',
          el('code', { textContent: v.group_id }));

        const progressFill = el('div', { className: 'dl-fill' });
        const progressText = el('span', { className: 'dl-text' });
        const cancel = el('button', { className: 'icon-btn dl-cancel', type: 'button', title: '取消下载', innerHTML: ICON.close });
        cancel.setAttribute('aria-label', `取消下载 ${v.info.name}`);
        cancel.addEventListener('click', () => { const job = downloads.get(v.group_id); if (job) job.ctl.abort(); });
        const progress = el('div', { className: 'dl', hidden: true },
          el('div', { className: 'dl-bar' }, progressFill), progressText, cancel);

        const fileName = safeName(`${meta.artist ? meta.artist + ' - ' : ''}${meta.title || adamId} [${v.info.name.replace(/ · /g, ' ')}].m4a`);
        const more = el('button', { className: 'icon-btn more-btn', type: 'button', title: '更多', innerHTML: ICON.more });
        more.setAttribute('aria-label', `${v.info.name} 更多操作`);
        more.setAttribute('aria-haspopup', 'menu');
        more.setAttribute('aria-expanded', 'false');
        more.addEventListener('click', () => openMenu(more, variantMenu(v, fileName)));
        const actions = el('div', { className: 'variant-actions' }, more);

        const row = el('div', { className: 'variant' }, playBtn, el('div', {}, name, detail, progress), actions);
        rows.set(v.group_id, { row, playBtn, progress, progressFill, progressText });
        nodes.push(row);
      }
      list.replaceChildren(...nodes);
      for (const id of downloads.keys()) renderDownload(id);
      $('count').textContent = `${variants.length} 个音质 · ${variants.filter((v) => v.mode).length} 个可在浏览器播放`;
      $('variants').hidden = false;
      $('play-best').disabled = !variants.some((v) => v.mode);
      $('vlc-best').hidden = !hook;
      $('vlc-best').disabled = variants.length === 0;
      syncRows(player.current, !player.audio.paused);
    }

    function syncRows(current, playing) {
      for (const [id, { row, playBtn }] of rows) {
        const active = current && current.id === id;
        row.classList.toggle('playing', !!active);
        playBtn.innerHTML = active && playing ? ICON.pause : ICON.play;
      }
    }
    player.onChange(syncRows);
    // 检测说能播但实际失败的编码：更新标记，避免再次误导
    player.onUnsupported((codecs) => {
      variants.forEach((v) => { if (v.codecs === codecs) v.mode = null; });
      renderVariants();
    });

    // VLC 能播所有音质，直接取最高音质
    $('vlc-best').addEventListener('click', () => { if (variants[0]) openInVlc(variants[0]); });

    $('play-best').addEventListener('click', () => {
      // 优先播放浏览器能播的最高音质
      const best = variants.find((v) => v.mode);
      if (best) player.play(playItem(best));
    });

    async function loadVariants() {
      $('reparse').disabled = true;
      showAlert('info', '正在获取 master m3u8…');
      try {
        const res = await fetch(`/parse/${adamId}`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.masterUrl || !Array.isArray(data.variants)) throw new Error(data.msg || `解析失败（HTTP ${res.status}）`);
        const base = data.masterUrl.slice(0, data.masterUrl.lastIndexOf('/') + 1);
        hook = !!data.hook;
        variants = data.variants.map((v) => ({
          ...v,
          info: describe(v),
          mode: detectMode(v.codecs, probe, hook),
          // 浏览器直连 CDN 的原始地址（浏览器端解密）
          m3u8Url: base + v.uri,
          // 服务端解密地址，仅 --hook 时可用
          hookM3u8Url: hook ? hookUrl(base + v.uri) : null,
          hookFileUrl: hook ? hookUrl(base + v.file_uri) : null,
        })).sort((a, b) => a.info.rank - b.info.rank || b.info.kbps - a.info.kbps || a.info.sub - b.info.sub || (b.bandwidth || 0) - (a.bandwidth || 0));
        renderVariants();
        showAlert('', '');
      } catch (err) {
        showAlert('error', err.message || '解析失败');
      } finally {
        $('reparse').disabled = false;
      }
    }

    // 浏览器直连 iTunes Lookup（该接口返回 Access-Control-Allow-Origin: *）。
    // 先查歌曲链接所在地区，查不到时依次回退 us / cn。
    async function lookupMeta() {
      for (const cc of new Set([country, 'us', 'cn'])) {
        try {
          const res = await fetch(`https://itunes.apple.com/lookup?id=${adamId}&country=${cc}&entity=song`, { signal: AbortSignal.timeout(8000) });
          if (!res.ok) continue;
          const t = (await res.json()).results?.[0];
          if (!t) continue;
          return {
            country: cc,
            title: t.trackName || '',
            artist: t.artistName || '',
            album: t.collectionName || '',
            // artworkUrl100 形如 .../100x100bb.jpg，换成大图
            artwork: (t.artworkUrl100 || '').replace('100x100bb', '600x600bb'),
            genre: t.primaryGenreName || '',
            releaseDate: t.releaseDate || '',
            durationMs: t.trackTimeMillis,
            explicit: t.trackExplicitness === 'explicit',
            url: t.trackViewUrl || '',
          };
        } catch {}
      }
      return {};
    }

    async function loadMeta() {
      meta = await lookupMeta();
      const title = meta.title || `歌曲 ${adamId}`;
      document.title = `${title} · am-hook`;
      $('title').textContent = title;
      $('title').classList.remove('skeleton');
      $('subtitle').textContent = [meta.artist, meta.album].filter(Boolean).join(' — ') || '未能获取歌曲信息';
      $('subtitle').classList.remove('skeleton');
      const tags = [];
      if (meta.releaseDate) tags.push(meta.releaseDate.slice(0, 4));
      if (meta.genre) tags.push(meta.genre);
      if (meta.durationMs) tags.push(window.AmHook.formatTime(meta.durationMs / 1000));
      if (meta.explicit) tags.push('E');
      tags.push(`ID ${adamId}`);
      $('meta').replaceChildren(...tags.map((t) => el('span', { className: 'badge', textContent: t })));
      if (meta.artwork) $('cover').replaceChildren(el('img', { src: meta.artwork, alt: `${title} 封面` }));
      if (meta.url) $('apple-link').href = meta.url;
      if (rows.size) renderVariants(); // 下载文件名需要歌名

      try {
        const key = 'am-hook:recent';
        const list = JSON.parse(localStorage.getItem(key) || '[]').filter((i) => i.id !== adamId);
        list.unshift({ id: adamId, link: songUrl, title: meta.title || '', artist: meta.artist || '', artwork: meta.artwork || '' });
        localStorage.setItem(key, JSON.stringify(list.slice(0, 12)));
      } catch {}
    }

    async function loadStatus() {
      const pill = $('status');
      try {
        const res = await fetch('/status');
        const data = await res.json();
        if (!res.ok || data.code !== 0) throw new Error();
        pill.classList.add('ok');
        pill.lastElementChild.textContent = `wrapper-lite · ${(data.regions || []).join(' / ').toUpperCase() || '在线'}`;
      } catch {
        pill.classList.add('bad');
        pill.lastElementChild.textContent = 'wrapper-lite 不可用';
      }
    }

    $('reparse').addEventListener('click', loadVariants);

    // 下载在页面内进行，离开页面会中断
    addEventListener('beforeunload', (e) => { if (downloads.size) e.preventDefault(); });

    if (!adamId) {
      showAlert('error', '无法从链接中识别歌曲 ID。');
    } else {
      loadMeta();
      loadVariants();
      loadStatus();
      AmDecrypt.cleanupStale();
    }
  </script>
</body>
</html>
