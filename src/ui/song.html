<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>am-hook · 音质</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #08080a;
      --surface: #141417;
      --surface-strong: #1c1c20;
      --line: #303038;
      --text: #f5f3f1;
      --muted: #a7a2a0;
      --accent: #fb2c55;
      --accent-hover: #ff4466;
      --error: #ff8087;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at 0% 0%, rgba(251, 44, 85, .12), transparent 36rem),
        var(--background);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
    }
    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px 24px 64px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: var(--text); }
    .brand-mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(135deg, #fb2c55, #ff7553);
      color: white;
    }
    .brand-name { font-size: 16px; font-weight: 750; white-space: nowrap; }
    .back {
      height: 38px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      text-decoration: none;
    }
    .back:hover { background: var(--surface); }
    .back svg { width: 15px; height: 15px; }
    .title-block {
      margin-top: 52px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 700; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 36px); line-height: 1.1; font-weight: 800; }
    .source { max-width: 700px; margin: 12px 0 0; color: var(--muted); overflow-wrap: anywhere; font-size: 13px; }
    .parse {
      height: 46px;
      flex: 0 0 auto;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .parse:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
    .parse:disabled { background: #6d202f; cursor: progress; transform: none; }
    .parse svg { width: 16px; height: 16px; }
    .alert {
      display: none;
      margin-top: 22px;
      padding: 11px 13px;
      border-radius: 8px;
      font-size: 13px;
    }
    .alert.info {
      display: block;
      border: 1px solid #34425b;
      background: rgba(58, 103, 177, .12);
      color: #9fbce8;
    }
    .alert.error {
      display: block;
      border: 1px solid rgba(255, 128, 135, .38);
      background: rgba(251, 44, 85, .09);
      color: var(--error);
    }
    .result {
      display: none;
      margin-top: 28px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      overflow: hidden;
    }
    .result-header {
      min-height: 58px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-strong);
    }
    .result-title { font-size: 15px; font-weight: 750; }
    .result-count { padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; min-width: 980px; border-collapse: collapse; }
    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid #232329;
      text-align: left;
      vertical-align: top;
    }
    th { background: #101013; color: #8f8b8a; font-size: 12px; font-weight: 650; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: rgba(255, 255, 255, .017); }
    .quality-name { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; }
    .quality-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .url-cell { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
    .url {
      min-width: 0;
      flex: 1;
      color: #c8c4c3;
      text-decoration: none;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .url:hover { color: white; text-decoration: underline; text-underline-offset: 3px; }
    .copy-button {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-strong);
      color: #cfcbca;
      cursor: pointer;
      transition: background .16s ease, color .16s ease, border-color .16s ease;
    }
    .copy-button:hover { color: white; border-color: #52525c; background: #242429; }
    .copy-button.copied { color: #6ce8a4; border-color: rgba(108, 232, 164, .42); background: rgba(108, 232, 164, .09); }
    .copy-button svg { width: 15px; height: 15px; }
    .empty {
      display: none;
      margin-top: 22px;
      padding: 42px 20px;
      border: 1px dashed #3f3f47;
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 720px) {
      .page { padding: 18px 16px 48px; }
      .title-block { margin-top: 40px; align-items: stretch; flex-direction: column; }
      .parse { width: 100%; justify-content: center; }
      .result-header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/">
        <div class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        </div>
        <span class="brand-name">am-hook</span>
      </a>
      <a class="back" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        主页
      </a>
    </header>

    <main>
      <div class="title-block">
        <div>
          <p class="eyebrow">QUALITY VARIANTS</p>
          <h1>音质解析</h1>
          <p class="source" id="song-url"></p>
        </div>
        <button class="parse" id="parse" type="button">
          解析
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"/><path d="M12 18v3"/><path d="M4.2 7.5l2.6 1.5"/><path d="M17.2 15l2.6 1.5"/><path d="M4.2 16.5l2.6-1.5"/><path d="M17.2 9l2.6-1.5"/></svg>
        </button>
      </div>

      <div class="alert" id="alert" aria-live="polite"></div>
      <div class="empty" id="empty">还没有解析结果</div>

      <section class="result" id="result">
        <div class="result-header">
          <div class="result-title">可用音质</div>
          <div class="result-count" id="count"></div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>音质</th>
                <th>media m3u8 完整地址</th>
                <th>media file 完整地址</th>
              </tr>
            </thead>
            <tbody id="variants"></tbody>
          </table>
        </div>
      </section>

      <template id="variant-row">
        <tr>
          <td>
            <span class="quality-name"></span>
            <span class="quality-meta"></span>
          </td>
          <td>
            <div class="url-cell">
              <a class="url" target="_blank" rel="noreferrer"></a>
              <button class="copy-button" type="button" title="复制 media m3u8 地址" aria-label="复制 media m3u8 地址">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
              </button>
            </div>
          </td>
          <td>
            <div class="url-cell">
              <a class="url" target="_blank" rel="noreferrer"></a>
              <button class="copy-button" type="button" title="复制 media file 地址" aria-label="复制 media file 地址">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
              </button>
            </div>
          </td>
        </tr>
      </template>
    </main>
  </div>

  <script>
    const songUrl = decodeURIComponent(location.pathname.slice(1));
    const adamId = (songUrl.match(/\/song\/[^/?#]+\/(\d+)(?:[/?#]|$)/i) || [])[1];
    const alertElement = document.getElementById('alert');
    const emptyElement = document.getElementById('empty');
    const parseButton = document.getElementById('parse');
    document.getElementById('song-url').textContent = songUrl;

    async function requestJson(url) {
      if (typeof fetch === 'function') {
        const response = await fetch(url);
        return { ok: response.ok, text: await response.text() };
      }

      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open('GET', url);
        request.onload = () => resolve({ ok: request.status >= 200 && request.status < 300, text: request.responseText });
        request.onerror = () => reject(new Error('网络请求失败'));
        request.send();
      });
    }

    function showAlert(kind, message) {
      alertElement.className = `alert ${kind}`;
      alertElement.textContent = message;
    }

    function qualityLabel(groupId, codecs) {
      const value = groupId.toLowerCase();
      if (value.includes('alac')) return 'ALAC';
      if (value.includes('he-stereo-64')) return 'HE-AAC 64';
      if (value.includes('stereo-256')) return 'AAC 256';
      if (value.includes('stereo-128')) return 'AAC 128';
      return groupId;
    }

    function hookUrl(relativeUrl) {
      return `${location.origin}/${relativeUrl.replace(/^\/+/, '')}`;
    }

    function copyText(text, button) {
      const markCopied = () => {
        button.classList.add('copied');
        button.title = '已复制';
        button.setAttribute('aria-label', '已复制');
        setTimeout(() => {
          button.classList.remove('copied');
          button.title = button.dataset.tooltip;
          button.setAttribute('aria-label', button.dataset.tooltip);
        }, 1300);
      };

      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(() => fallbackCopy(text, markCopied));
      } else {
        fallbackCopy(text, markCopied);
      }
    }

    function fallbackCopy(text, done) {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
      done();
    }

    parseButton.addEventListener('click', async () => {
      parseButton.disabled = true;
      emptyElement.style.display = 'none';
      document.getElementById('result').style.display = 'none';
      showAlert('info', '正在获取 master m3u8。');
      try {
        const { ok, text } = await requestJson(`/parse/${adamId}`);
        const data = JSON.parse(text);
        if (!ok || !data.masterUrl || !Array.isArray(data.variants)) {
          throw new Error(data.msg || '解析失败');
        }

        const masterBase = data.masterUrl.slice(0, data.masterUrl.lastIndexOf('/') + 1);
        const template = document.getElementById('variant-row');
        const rows = data.variants.map((item) => {
          const row = template.content.cloneNode(true);
          const m3u8Url = hookUrl(masterBase + item.uri);
          const fileUrl = hookUrl(masterBase + item.file_uri);
          row.querySelector('.quality-name').textContent = qualityLabel(item.group_id, item.codecs);
          row.querySelector('.quality-meta').textContent = `${item.group_id} · ${item.codecs}`;

          const links = row.querySelectorAll('.url');
          const buttons = row.querySelectorAll('.copy-button');
          links[0].href = m3u8Url;
          links[0].textContent = m3u8Url;
          links[1].href = fileUrl;
          links[1].textContent = fileUrl;
          buttons[0].dataset.tooltip = '复制 media m3u8 地址';
          buttons[1].dataset.tooltip = '复制 media file 地址';
          buttons[0].addEventListener('click', () => copyText(m3u8Url, buttons[0]));
          buttons[1].addEventListener('click', () => copyText(fileUrl, buttons[1]));
          return row;
        });

        const tbody = document.getElementById('variants');
        tbody.replaceChildren(...rows);
        document.getElementById('count').textContent = `${data.variants.length} 个音质`;
        document.getElementById('result').style.display = 'block';
        showAlert('info', `已解析 ${data.variants.length} 个音质。`);
      } catch (error) {
        emptyElement.style.display = 'block';
        showAlert('error', error.message || '解析失败');
      } finally {
        parseButton.disabled = false;
      }
    });
  </script>
</body>
</html>
