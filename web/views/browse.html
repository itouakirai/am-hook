<div class="page">
  <main class="browse">
    <!-- multi-room 头图（官网 multi-room-header：uber.masterArt） -->
    <div class="browse-banner" id="banner" hidden></div>
    <!-- 页面标题（官网 header-nav：34px 粗体） -->
    <header class="browse-header">
      <div class="browse-header-row">
        <h1 class="browse-title skeleton" id="title">&nbsp;</h1>
        <!-- 排行榜「查看全部」的类型选择（官网 header 的 accessory select） -->
        <div class="browse-tools" id="tools" hidden></div>
      </div>
      <p class="browse-notes" id="notes" hidden></p>
    </header>

    <div class="alert info" id="alert" hidden aria-live="polite"></div>

    <!-- 区块（官网 editorial-elements：hero、货架、链接列表等），room 与策展人歌单页为网格 -->
    <div class="browse-sections" id="sections"></div>
    <div class="browse-more" id="more" hidden></div>

    <div class="artist-footer">
      <a class="artist-footer-link" id="apple-link" target="_blank" rel="noreferrer">
        <span data-i18n="browse.openInApple"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
      </a>
    </div>
  </main>
</div>
