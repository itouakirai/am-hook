[package]
name = "am-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser (wasm32-unknown-unknown) build of am-hook's fMP4 decryption"

# 构建：scripts/build-wasm.sh -> web/decrypt/hook.wasm
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
am-mp4 = { path = "../am-mp4" }
# 内容密钥解密（Widevine 歌曲的 CENC）
am-media = { path = "../am-media" }
