name: Build Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check
        run: cargo check --verbose

      - name: Clippy
        # 只在 Linux 跑一次：lint 结果与平台无关，stable 新增 lint 时也只需要看一处
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run offline tests
        run: cargo test --workspace --verbose

      - name: Run Node unit tests
        # tests/unit/ 全部：serverless 后端与 dist/ 的生成、ALAC 检测、JOC 渲染（web/joc/joc.wasm 与参考摘要逐位一致）、
        # AutoMix 规划、歌词对唱、下载核心（ZIP / 标签 / 文件名模板）、限流退避、播放器与 MV 播放列表 / 字幕。
        # 离线，只需要 runner 自带的 Node；结果与平台无关，只在 Linux 跑
        if: runner.os == 'Linux'
        run: node tests/run.mjs unit
