[package]
name = "am-hook"
version = "0.1.0"
edition = "2021"

[lib]
name = "am_hook"
path = "src/lib.rs"

[[bin]]
name = "am-hook"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
temari = { path = "crates/temari" }
am-mp4 = { path = "crates/am-mp4" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
bytes = "1"
futures = "0.3"
lru = "0.12"

[workspace]
members = [".", "crates/temari", "crates/am-mp4", "crates/am-wasm"]

# 解密是热点，debug 构建下也优化 temari，否则测试与本地调试会很慢
[profile.dev.package.temari]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
