[package]
name = "am-hook"
version = "0.2.6"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "am_hook"
path = "src/lib.rs"

[[bin]]
name = "am-hook"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "gzip", "brotli"] }
base64 = "0.22"
am-mp4 = { path = "crates/am-mp4" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
regex = "1"
bytes = "1"
futures = "0.3"
lru = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[workspace]
members = [".", "crates/temari", "crates/am-alac", "crates/am-mp4", "crates/am-wasm", "crates/am-flac-wasm", "crates/am-media", "crates/am-media-wasm"]

# 解密是热点，debug 构建下也优化 temari，否则测试与本地调试会很慢
[profile.dev.package.temari]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
